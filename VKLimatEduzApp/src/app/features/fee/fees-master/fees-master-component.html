<div class="shell full-bleed">
  <div class="layout">
    <section class="panel">
      <div class="panel-body">
        <div class="tabs-container">
          <nav class="tabs-nav" role="tablist" aria-label="Fees master sections">
            @for (tab of tabs; track tab.key) {
              <button
                type="button"
                class="tab-btn"
                [class.active]="activeTab() === tab.key"
                (click)="selectTab(tab.key)"
                role="tab"
                [attr.aria-selected]="activeTab() === tab.key">
                {{ tab.label }}
              </button>
            }
          </nav>

          <div class="tab-panel" role="tabpanel">
            @switch (activeTab()) {
              @case ('group') { <app-group-tab /> }
              @case ('fee-comp') { <app-feeComp-tab /> }
              @case ('feeplan') { <app-feeplan-tab /> }
              @case ('optional') { <app-optional-tab /> }
              @case ('concessionType') { <app-concession-tab /> }
              @case ('concession') { <app-concession-details-tab /> }
              @case ('due-adv') { <app-due-adv-tab /> }
            }
          </div>
        </div>
      </div>
    </section>
  </div>
</div>
