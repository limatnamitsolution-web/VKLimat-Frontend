<div class="toolbar-container">
  <input type="text" [value]="searchTerm()" (input)="updateSearch($event)" placeholder="Search all fields..." class="input-control input-search">
  <div class="btn-group"><button type="button" (click)="openAdd()" class="btn-primary btn-sm">Add</button><button type="button" (click)="resetSearch()" class="btn-reset btn-sm">Reset</button></div>
</div>
<div class="table-responsive">
<table class="data-table">
  <thead>
    <tr>
      <th>Feeplan Name</th>
      <th>Academic Year</th>
      <th>Class</th>
      <th>Fee Group</th>
      <th>Total Amount</th>
      <th>Status</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    @for (row of filteredRows(); track row) {
      <tr>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
      </tr>
    } @empty {
      <tr><td colspan="7">No feeplans found.</td></tr>
    }
  </tbody>
</table>
</div>
@if (showView()) {
  <div class="modal-overlay" (click)="cancelModel()">
    <div class="modal-content modern-modal small-modal" role="dialog" aria-modal="true" aria-label="Feeplan View" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <div class="header-content">
          <h2>Feeplan View</h2>
          <p>Enter fee plan details.</p>
        </div>
        <button type="button" class="close-btn" aria-label="Close" (click)="cancelModel()">&times;</button>
      </div>

      <form [formGroup]="form" (ngSubmit)="saveModel()" class="form-layout">
        <div class="modal-body">
          <div class="grid-2">
            <div class="form-field"><label for="fpBranch">Branch</label><select id="fpBranch" formControlName="BranchId"><option value="">Select</option><option value="1">Branch 1</option><option value="2">Branch 2</option></select></div>
            <div class="form-field"><label for="fpFY">FY</label><input id="fpFY" type="text" formControlName="FY"></div>

            <div class="form-field">
              <label for="fpGroup">Fee Group</label>
              <app-searchable-dropdown
                id="fpGroup"
                formControlName="FeeGroupId"
                [options]="feeGroups()"
                placeholder="Select Fee Group">
              </app-searchable-dropdown>
            </div>
            <div class="form-field">
              <label for="fpComp">Fee Component</label>
              <app-searchable-dropdown
                id="fpComp"
                formControlName="FeeCompId"
                [options]="feeComponents()"
                placeholder="Select Fee Component">
              </app-searchable-dropdown>
            </div>

            <div class="form-field"><label for="fpFees">Fees</label><input id="fpFees" type="number" formControlName="Fees"></div>
            <div class="form-field"><label for="fpOrder">OrderId</label><input id="fpOrder" type="number" formControlName="OrderId"></div>

            <div class="form-field"><label for="fpTaken">FeeCompTaken</label><select id="fpTaken" formControlName="FeeCompTaken"><option value="Yes">Yes</option><option value="No">No</option></select></div>
            <div class="form-field"><label for="fpOpt">FeeCompOpt</label><select id="fpOpt" formControlName="FeeCompOpt"><option value="Yes">Yes</option><option value="No">No</option></select></div>

            <div class="form-field"><label for="fpRefund">FeeCompRefundable</label><select id="fpRefund" formControlName="FeeCompRefundable"><option value="Yes">Yes</option><option value="No">No</option></select></div>
            <div class="form-field"><label for="fpDisp">DispFeeRecpt</label><select id="fpDisp" formControlName="DispFeeRecpt"><option value="Yes">Yes</option><option value="No">No</option></select></div>

            <div class="form-field"><label for="fpEditable">FeeCompEditable</label><select id="fpEditable" formControlName="FeeCompEditable"><option value="Yes">Yes</option><option value="No">No</option></select></div>
            <div class="form-field"><label for="fpConcEditable">FeeConcEditable</label><select id="fpConcEditable" formControlName="FeeConcEditable"><option value="Yes">Yes</option><option value="No">No</option></select></div>
          </div>

          <div class="form-section">
            <h3 class="section-title">Month</h3>
            <div class="monthIds-grid" formArrayName="months">
              @for (month of monthsList; track $index) {
                <div class="month-item">
                  <label [for]="'fp-month-'+$index">{{ month.label }}</label>
                  <input type="checkbox" [formControlName]="$index" [id]="'fp-month-'+$index">
                </div>
              }
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-text" (click)="cancelModel()">Cancel</button>
          <button type="submit" class="btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>
}
