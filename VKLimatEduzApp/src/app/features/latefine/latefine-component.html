<div class="shell full-bleed">
  <div class="layout">
    <section class="panel">
      <div class="panel-body">
        <div class="tabs-container">
          <nav class="tabs-nav" role="tablist" aria-label="Late fine sections">
            @for (tab of tabs; track tab.key) {
              <button
                type="button"
                class="tab-btn"
                [class.active]="activeTab() === tab.key"
                (click)="selectTab(tab.key)"
                role="tab"
                [attr.aria-selected]="activeTab() === tab.key">
                {{ tab.label }}
              </button>
            }
          </nav>

          <div class="tab-panel" role="tabpanel">
            @switch (activeTab()) {
              @case ('late-fees-days') { <app-late-fees-days-tab /> }
              @case ('late-fees-months') { <app-late-fees-months-tab /> }
              @case ('late-fees-stud') { <app-late-fees-stud-tab /> }
              @case ('late-fine-attendance') { <app-late-fine-attendance-tab /> }
            }
          </div>
        </div>
      </div>
    </section>
  </div>
</div>
