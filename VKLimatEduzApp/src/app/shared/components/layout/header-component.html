  <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <div class="brand-badge">EZ</div>
          <div class="brand-title">EduZ Platform</div>
        </div>

        <div class="school-heading" title="School name">
          <span class="school-heading-name">{{ schoolName() }}</span>
        </div>

        <div class="top-actions">
          <!-- Theme Toggle -->
          <div class="theme-toggle">
            <button class="theme-toggle-btn" (click)="toggleThemeSwitcher($event)">
              <i class="fas fa-palette"></i>
              <span>Themes</span>
            </button>
            <div class="theme-switcher" [class.active]="isThemeSwitcherOpen">
              <div class="theme-options">
                <label *ngFor="let theme of themes"
                       class="theme-option"
                       [ngClass]="theme.className"
                       [class.active]="currentTheme === theme.id">
                  <input type="radio" name="theme" [value]="theme.id" [checked]="currentTheme === theme.id"
                         (change)="changeTheme(theme.id)">
                  <div class="theme-color-box">
                    <div class="theme-preview">
                      <div class="preview-bar"></div>
                      <div class="preview-dot"></div>
                    </div>
                  </div>
                  <span class="theme-label">{{ theme.name }}</span>
                  <div *ngIf="theme.badge" class="theme-badge" [ngClass]="theme.badgeClass">
                    {{ theme.badge }}
                  </div>
                </label>
              </div>
            </div>
          </div>

          <button class="icon-btn" title="Notifications"><i class="fas fa-bell"></i></button>
          <button class="icon-btn" title="Help"><i class="fas fa-circle-question"></i></button>
          
          <div class="profile">
            <button class="module-switcher-btn" (click)="toggleModuleSwitcher()">
              <i class="fas fa-layer-group"></i>
              <span>Switch Module</span>
            </button>
            
            <div class="avatar-wrap">
              <div class="avatar" [attr.aria-label]="userFullName()">
                {{ userInitials() }}
              </div>
              <div class="avatar-fullname" role="tooltip">{{ userFullName() }}</div>
            </div>
            <div class="profile-menu">
              <button
                class="icon-btn"
                title="Profile"
                aria-haspopup="menu"
                aria-label="Profile menu"
                [attr.aria-expanded]="isProfileMenuOpen"
                (click)="toggleProfileMenu($event)">
                <i class="fas fa-ellipsis-vertical"></i>
              </button>
              <div class="logout-popup" role="menu" [class.active]="isProfileMenuOpen">
                <button class="logout-btn" (click)="logout()" role="menuitem" type="button">
                  <i class="fas fa-sign-out-alt"></i>
                  <span>Logout</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <app-module-switcher 
      [isModuleSwitcherOpen]="isModuleSwitcherOpen" 
      (close)="closeModuleSwitcher()">
    </app-module-switcher>
